<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>坦克大战 - Tank Battle</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a0a;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: 'Courier New', 'Microsoft YaHei', monospace;
    overflow: hidden;
    user-select: none;
  }

  .game-wrapper {
    display: flex;
    gap: 20px;
    align-items: stretch;
  }

  .game-container {
    position: relative;
    border: 3px solid #3a3a3a;
    border-radius: 4px;
    box-shadow: 0 0 30px rgba(0, 150, 0, 0.3), inset 0 0 30px rgba(0, 0, 0, 0.5);
  }

  canvas {
    display: block;
    background: #111;
  }

  .side-panel {
    background: #1a1a1a;
    border: 2px solid #3a3a3a;
    border-radius: 4px;
    padding: 20px;
    color: #4f4;
    min-width: 200px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    font-size: 14px;
    box-shadow: 0 0 20px rgba(0, 150, 0, 0.15);
  }

  .side-panel h2 {
    text-align: center;
    color: #6f6;
    font-size: 22px;
    letter-spacing: 4px;
    border-bottom: 1px solid #3a3a3a;
    padding-bottom: 10px;
    margin-bottom: 4px;
  }

  .stat-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .stat-label {
    color: #aaa;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 2px;
  }

  .stat-value {
    color: #ff0;
    font-size: 20px;
    font-weight: bold;
  }

  .lives-display {
    display: flex;
    gap: 6px;
  }

  .life-icon {
    width: 20px;
    height: 20px;
    background: #4f4;
    clip-path: polygon(50% 0%, 65% 15%, 85% 15%, 100% 35%, 100% 60%,
      80% 80%, 50% 100%, 20% 80%, 0% 60%, 0% 35%, 15% 15%, 35% 15%);
  }

  .life-icon.lost {
    background: #333;
  }

  .key-hints {
    font-size: 11px;
    color: #666;
    line-height: 1.8;
  }

  .key-hints span {
    color: #aaa;
    background: #222;
    padding: 2px 6px;
    border-radius: 3px;
    border: 1px solid #444;
    font-size: 10px;
  }

  .btn {
    background: #2a2a2a;
    color: #4f4;
    border: 1px solid #4f4;
    padding: 10px;
    cursor: pointer;
    font-family: inherit;
    font-size: 14px;
    letter-spacing: 2px;
    border-radius: 3px;
    transition: all 0.2s;
    text-transform: uppercase;
  }

  .btn:hover {
    background: #4f4;
    color: #111;
    box-shadow: 0 0 15px rgba(0, 255, 0, 0.3);
  }

  .btn:active {
    transform: scale(0.97);
  }

  .game-overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: rgba(0, 0, 0, 0.8);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.4s;
  }

  .game-overlay.active {
    opacity: 1;
    pointer-events: all;
  }

  .game-overlay .title {
    font-size: 42px;
    color: #4f4;
    font-weight: bold;
    letter-spacing: 8px;
    margin-bottom: 10px;
    text-shadow: 0 0 20px rgba(0, 255, 0, 0.5);
  }

  .game-overlay .subtitle {
    font-size: 16px;
    color: #aaa;
    margin-bottom: 20px;
  }

  .game-overlay .score-final {
    font-size: 24px;
    color: #ff0;
    margin-bottom: 30px;
  }
</style>
</head>
<body>

<div class="game-wrapper">
  <div class="game-container" id="gameContainer">
    <canvas id="gameCanvas"></canvas>
    <div class="game-overlay active" id="startOverlay">
      <div class="title">坦 克 大 战</div>
      <div class="subtitle">TANK BATTLE</div>
      <button class="btn" onclick="startGame()">开始游戏</button>
      <div class="key-hints" style="margin-top:20px;">
        <span>↑ ↓ ← →</span> 移动 &nbsp; <span>空格</span> 射击 &nbsp; <span>P</span> 暂停
      </div>
    </div>
    <div class="game-overlay" id="gameOverOverlay">
      <div class="title" id="endTitle">GAME OVER</div>
      <div class="score-final" id="finalScore"></div>
      <button class="btn" onclick="startGame()">重新开始</button>
    </div>
    <div class="game-overlay" id="pauseOverlay">
      <div class="title" style="font-size:36px;">暂 停</div>
      <div class="subtitle">PAUSED</div>
      <button class="btn" onclick="togglePause()">继续游戏</button>
    </div>
  </div>

  <div class="side-panel">
    <h2>坦 克 大 战</h2>
    <div class="stat-row">
      <span class="stat-label">🏆 得分</span>
      <span class="stat-value" id="scoreDisplay">0</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">📊 关卡</span>
      <span class="stat-value" id="levelDisplay">1</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">💀 击杀</span>
      <span class="stat-value" id="killsDisplay">0</span>
    </div>
    <div>
      <span class="stat-label">❤️ 生命</span>
      <div class="lives-display" id="livesDisplay" style="margin-top:4px;"></div>
    </div>
    <div class="stat-row">
      <span class="stat-label">🛡️ 基地</span>
      <span class="stat-value" style="font-size:14px;" id="baseStatus">完好</span>
    </div>
    <hr style="border-color:#2a2a2a; margin:4px 0;">
    <div class="key-hints">
      <span>↑ ↓ ← →</span> 移动坦克<br>
      <span>空格</span> 发射炮弹<br>
      <span>P</span> 暂停 / 继续<br>
      <span>R</span> 重新开始
    </div>
    <button class="btn" onclick="startGame()">🔄 新游戏</button>
    <button class="btn" onclick="togglePause()">⏯️ 暂停</button>
  </div>
</div>

<script>
// ==================== 游戏引擎 ====================
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// 画布尺寸
const COLS = 26;
const ROWS = 26;
const CELL = 24;
canvas.width = COLS * CELL;
canvas.height = ROWS * CELL;

// 游戏状态
let gameState = 'start'; // start | playing | paused | over | victory
let score = 0;
let level = 1;
let kills = 0;
let lives = 3;
let playerTank = null;
let enemies = [];
let bullets = [];
let walls = [];
let basePos = null;
let baseAlive = true;
let spawnTimer = 0;
let enemySpawnCount = 0;
let maxEnemiesPerLevel = 4;
let enemiesToSpawn = 0;
let particles = [];
let powerUps = [];
let shakeTimer = 0;
let shakeIntensity = 0;

// 输入处理
const keys = {};
window.addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  keys[e.code] = true;
  if (e.key.toLowerCase() === 'p') togglePause();
  if (e.key.toLowerCase() === 'r') startGame();
  e.preventDefault();
});
window.addEventListener('keyup', e => {
  keys[e.key.toLowerCase()] = false;
  keys[e.code] = false;
  e.preventDefault();
});

// 音效系统
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
function initAudio() {
  if (!audioCtx) audioCtx = new AudioCtx();
}

function playSound(freq, type, duration, vol = 0.1, glide = 0) {
  if (!audioCtx) return;
  try {
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (glide) osc.frequency.linearRampToValueAtTime(freq + glide, t + duration);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + duration);
  } catch(e) {}
}

function sfxShoot() { playSound(200, 'square', 0.15, 0.08, -100); }
function sfxHit() { playSound(60, 'sawtooth', 0.2, 0.1); }
function sfxExplode() { playSound(40, 'sawtooth', 0.4, 0.12, -20); }
function sfxPowerUp() { playSound(600, 'square', 0.1, 0.08, 200); }
function sfxGameOver() { playSound(80, 'sawtooth', 0.6, 0.15, -40); }
function sfxLevelUp() { playSound(300, 'square', 0.15, 0.1, 200);
                        setTimeout(() => playSound(500, 'square', 0.15, 0.1, 200), 120); }

// 粒子系统
function spawnParticles(x, y, color, count = 10) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 1 + Math.random() * 4;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 1,
      decay: 0.02 + Math.random() * 0.06,
      color,
      size: 1 + Math.random() * 3
    });
  }
}

// 地图定义
function generateMap() {
  walls = [];
  baseAlive = true;

  // 基地位置（底部中央）
  basePos = { x: Math.floor(COLS / 2), y: ROWS - 2 };

  // 基地围墙
  const bx = basePos.x;
  const by = basePos.y;
  walls.push({ x: bx - 1, y: by, type: 'brick' });
  walls.push({ x: bx + 1, y: by, type: 'brick' });
  walls.push({ x: bx - 1, y: by - 1, type: 'brick' });
  walls.push({ x: bx, y: by - 1, type: 'brick' });
  walls.push({ x: bx + 1, y: by - 1, type: 'brick' });

  // 随机砖墙
  const wallPatterns = [
    // 水平墙段
    { sx: 2, sy: 2, w: 4, h: 1 }, { sx: 10, sy: 2, w: 4, h: 1 }, { sx: 18, sy: 2, w: 4, h: 1 },
    { sx: 2, sy: 6, w: 3, h: 1 }, { sx: 14, sy: 6, w: 4, h: 1 }, { sx: 22, sy: 6, w: 2, h: 1 },
    { sx: 6, sy: 10, w: 4, h: 1 }, { sx: 16, sy: 10, w: 4, h: 1 },
    { sx: 2, sy: 14, w: 3, h: 1 }, { sx: 10, sy: 14, w: 6, h: 1 }, { sx: 20, sy: 14, w: 4, h: 1 },
    { sx: 6, sy: 18, w: 4, h: 1 }, { sx: 16, sy: 18, w: 4, h: 1 },
    { sx: 2, sy: 22, w: 4, h: 1 }, { sx: 12, sy: 22, w: 4, h: 1 }, { sx: 20, sy: 22, w: 4, h: 1 },
    // 垂直墙段
    { sx: 4, sy: 4, w: 1, h: 3 }, { sx: 12, sy: 4, w: 1, h: 3 }, { sx: 20, sy: 4, w: 1, h: 3 },
    { sx: 8, sy: 8, w: 1, h: 4 }, { sx: 16, sy: 8, w: 1, h: 2 },
    { sx: 4, sy: 12, w: 1, h: 3 }, { sx: 22, sy: 12, w: 1, h: 3 },
    { sx: 8, sy: 16, w: 1, h: 2 }, { sx: 14, sy: 16, w: 1, h: 2 }, { sx: 20, sy: 16, w: 1, h: 2 },
    { sx: 4, sy: 20, w: 1, h: 2 }, { sx: 10, sy: 20, w: 1, h: 2 }, { sx: 18, sy: 20, w: 1, h: 2 },
  ];

  wallPatterns.forEach(p => {
    for (let dx = 0; dx < p.w; dx++) {
      for (let dy = 0; dy < p.h; dy++) {
        const wx = p.sx + dx;
        const wy = p.sy + dy;
        // 不覆盖基地周围
        if (Math.abs(wx - bx) <= 1 && Math.abs(wy - by) <= 1) continue;
        // 偶尔放钢墙
        const type = (Math.random() < 0.15) ? 'steel' : 'brick';
        walls.push({ x: wx, y: wy, type });
      }
    }
  });

  // 边界不可破坏钢墙（用world碰撞检测替代，不添加到walls）
}

function isWallAt(x, y) {
  // 边界检测
  if (x < 0 || x >= COLS || y < 0 || y >= ROWS) return 'boundary';
  const wall = walls.find(w => w.x === x && w.y === y);
  return wall ? wall.type : null;
}

function destroyWall(x, y) {
  const idx = walls.findIndex(w => w.x === x && w.y === y);
  if (idx !== -1 && walls[idx].type === 'brick') {
    walls.splice(idx, 1);
    spawnParticles(x * CELL + CELL / 2, y * CELL + CELL / 2, '#c84', 8);
    return true;
  }
  return false;
}

// 坦克类
class Tank {
  constructor(x, y, dir, color, isPlayer = false) {
    this.x = x;
    this.y = y;
    this.dir = dir; // up down left right
    this.color = color;
    this.isPlayer = isPlayer;
    this.speed = isPlayer ? 0.12 : 0.04;
    this.shootCooldown = 0;
    this.shootDelay = isPlayer ? 30 : 80;
    this.alive = true;
    this.size = CELL * 0.85;
    this.hp = 1;
    this.flashTimer = 0;
    this.moveTimer = 0;
    this.aiDirChange = 0;
  }

  update() {
    if (!this.alive) return;
    if (this.shootCooldown > 0) this.shootCooldown--;
    if (this.flashTimer > 0) this.flashTimer--;

    if (this.isPlayer) {
      this.updatePlayer();
    } else {
      this.updateAI();
    }
  }

  updatePlayer() {
    let dx = 0, dy = 0;
    let newDir = null;

    if (keys['arrowup'] || keys['w']) { dy = -1; newDir = 'up'; }
    else if (keys['arrowdown'] || keys['s']) { dy = 1; newDir = 'down'; }
    else if (keys['arrowleft'] || keys['a']) { dx = -1; newDir = 'left'; }
    else if (keys['arrowright'] || keys['d']) { dx = 1; newDir = 'right'; }

    if (newDir) this.dir = newDir;

    if (dx !== 0 || dy !== 0) {
      const newX = this.x + dx * this.speed;
      const newY = this.y + dy * this.speed;
      if (this.canMoveTo(newX, newY, dx, dy)) {
        this.x = Math.round(newX * 100) / 100;
        this.y = Math.round(newY * 100) / 100;
      }
      // 对齐到网格以便转弯
      if (dx !== 0) {
        this.y = Math.round(this.y * 2) / 2;
      }
      if (dy !== 0) {
        this.x = Math.round(this.x * 2) / 2;
      }
    }

    // 射击
    if ((keys[' '] || keys['space']) && this.shootCooldown <= 0) {
      this.shoot();
    }
  }

  updateAI() {
    this.moveTimer++;
    this.aiDirChange--;

    if (this.aiDirChange <= 0) {
      const dirs = ['up', 'down', 'left', 'right'];
      // 偏向玩家方向
      if (playerTank && playerTank.alive && Math.random() < 0.4) {
        const dx = playerTank.x - this.x;
        const dy = playerTank.y - this.y;
        if (Math.abs(dx) > Math.abs(dy)) {
          this.dir = dx > 0 ? 'right' : 'left';
        } else {
          this.dir = dy > 0 ? 'down' : 'up';
        }
      } else {
        this.dir = dirs[Math.floor(Math.random() * 4)];
      }
      this.aiDirChange = 40 + Math.random() * 80;
    }

    let dx = 0, dy = 0;
    switch (this.dir) {
      case 'up': dy = -1; break;
      case 'down': dy = 1; break;
      case 'left': dx = -1; break;
      case 'right': dx = 1; break;
    }

    const newX = this.x + dx * this.speed;
    const newY = this.y + dy * this.speed;
    if (this.canMoveTo(newX, newY, dx, dy)) {
      this.x = Math.round(newX * 100) / 100;
      this.y = Math.round(newY * 100) / 100;
    } else {
      this.aiDirChange = 0; // 撞墙立即换方向
    }

    // 对齐
    if (dx !== 0) this.y = Math.round(this.y * 2) / 2;
    if (dy !== 0) this.x = Math.round(this.x * 2) / 2;

    // AI射击
    if (this.shootCooldown <= 0 && Math.random() < 0.015) {
      this.shoot();
    }
  }

  canMoveTo(nx, ny) {
    const half = this.size / CELL / 2;
    const margin = 0.3;

    // 检查四个角
    const corners = [
      { x: nx - half + margin, y: ny - half + margin },
      { x: nx + half - margin, y: ny - half + margin },
      { x: nx - half + margin, y: ny + half - margin },
      { x: nx + half - margin, y: ny + half - margin },
    ];

    for (const c of corners) {
      const cx = Math.floor(c.x);
      const cy = Math.floor(c.y);
      const wall = isWallAt(cx, cy);
      if (wall) return false;

      // 与其他坦克碰撞
      const allTanks = this.isPlayer ? enemies : [playerTank, ...enemies];
      for (const t of allTanks) {
        if (!t || !t.alive || t === this) continue;
        const dist = Math.hypot(nx - t.x, ny - t.y);
        if (dist < (this.size + t.size) / CELL / 2 - 0.1) return false;
      }
    }

    // 不可穿过基地
    if (basePos) {
      const dist = Math.hypot(nx - basePos.x, ny - basePos.y);
      if (dist < 1.2) return false;
    }

    return true;
  }

  shoot() {
    if (this.shootCooldown > 0) return;
    this.shootCooldown = this.shootDelay;
    const bx = Math.round(this.x);
    const by = Math.round(this.y);
    let bdx = 0, bdy = 0;
    switch (this.dir) {
      case 'up': bdy = -1; break;
      case 'down': bdy = 1; break;
      case 'left': bdx = -1; break;
      case 'right': bdx = 1; break;
    }
    bullets.push({
      x: bx,
      y: by,
      dx: bdx,
      dy: bdy,
      owner: this.isPlayer ? 'player' : 'enemy',
      alive: true,
      speed: 0.25,
    });
    if (this.isPlayer) sfxShoot();
  }

  hit() {
    this.hp--;
    this.flashTimer = 10;
    if (this.hp <= 0) {
      this.alive = false;
      spawnParticles(
        Math.round(this.x) * CELL + CELL / 2,
        Math.round(this.y) * CELL + CELL / 2,
        this.isPlayer ? '#4f4' : '#f44',
        20
      );
      sfxExplode();
      if (!this.isPlayer) {
        kills++;
        score += 100 * level;
        updateUI();

        // 随机掉落道具
        if (Math.random() < 0.2) {
          const types = ['speed', 'multiShot', 'shield'];
          powerUps.push({
            x: Math.round(this.x),
            y: Math.round(this.y),
            type: types[Math.floor(Math.random() * types.length)],
            timer: 400,
          });
        }
      }
    }
  }

  draw(ctx) {
    if (!this.alive) return;
    if (this.flashTimer > 0 && this.flashTimer % 2 === 0) return; // 闪烁

    const cx = Math.round(this.x) * CELL + CELL / 2;
    const cy = Math.round(this.y) * CELL + CELL / 2;
    const s = this.size / 2;

    ctx.save();
    ctx.translate(cx, cy);

    let angle = 0;
    switch (this.dir) {
      case 'up': angle = 0; break;
      case 'down': angle = Math.PI; break;
      case 'left': angle = -Math.PI / 2; break;
      case 'right': angle = Math.PI / 2; break;
    }
    ctx.rotate(angle);

    // 履带
    ctx.fillStyle = '#222';
    ctx.fillRect(-s, -s + 2, s * 2, s * 2 - 4);
    // 履带纹理
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 1;
    for (let i = -s + 3; i < s - 2; i += 3) {
      ctx.beginPath();
      ctx.moveTo(-s + 1, i);
      ctx.lineTo(-s + 3, i);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(s - 3, i);
      ctx.lineTo(s - 1, i);
      ctx.stroke();
    }

    // 车身
    const bodyGrad = ctx.createLinearGradient(0, -s, 0, s);
    bodyGrad.addColorStop(0, this.color);
    bodyGrad.addColorStop(1, this.darken(this.color, 0.5));
    ctx.fillStyle = bodyGrad;
    ctx.fillRect(-s + 3, -s + 3, s * 2 - 6, s * 2 - 6);

    // 炮塔
    ctx.fillStyle = this.darken(this.color, 0.3);
    ctx.beginPath();
    ctx.arc(0, 0, s * 0.55, 0, Math.PI * 2);
    ctx.fill();

    // 炮管
    ctx.fillStyle = '#ddd';
    ctx.fillRect(-2, -s - 2, 4, s * 0.7 + 2);
    ctx.strokeStyle = '#999';
    ctx.lineWidth = 1;
    ctx.strokeRect(-2, -s - 2, 4, s * 0.7 + 2);

    // 高光
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    ctx.fillRect(-s + 4, -s + 3, s * 2 - 8, s);

    ctx.restore();
  }

  darken(hex, factor) {
    const r = parseInt(hex.slice(1,3), 16);
    const g = parseInt(hex.slice(3,5), 16);
    const b = parseInt(hex.slice(5,7), 16);
    const dr = Math.floor(r * factor);
    const dg = Math.floor(g * factor);
    const db = Math.floor(b * factor);
    return `rgb(${dr},${dg},${db})`;
  }
}

// ==================== 游戏逻辑 ====================

function startGame() {
  initAudio();
  gameState = 'playing';
  score = 0;
  level = 1;
  kills = 0;
  lives = 3;
  enemies = [];
  bullets = [];
  particles = [];
  powerUps = [];
  enemySpawnCount = 0;
  enemiesToSpawn = maxEnemiesPerLevel;
  spawnTimer = 0;
  shakeTimer = 0;

  generateMap();
  playerTank = new Tank(Math.floor(COLS / 2), ROWS - 4, 'up', '#4f4', true);

  document.getElementById('startOverlay').classList.remove('active');
  document.getElementById('gameOverOverlay').classList.remove('active');
  document.getElementById('pauseOverlay').classList.remove('active');
  updateUI();
}

function togglePause() {
  if (gameState === 'playing') {
    gameState = 'paused';
    document.getElementById('pauseOverlay').classList.add('active');
  } else if (gameState === 'paused') {
    gameState = 'playing';
    document.getElementById('pauseOverlay').classList.remove('active');
  }
}

function updateUI() {
  document.getElementById('scoreDisplay').textContent = score;
  document.getElementById('levelDisplay').textContent = level;
  document.getElementById('killsDisplay').textContent = kills;

  // 生命显示
  const livesDiv = document.getElementById('livesDisplay');
  livesDiv.innerHTML = '';
  for (let i = 0; i < 3; i++) {
    const icon = document.createElement('div');
    icon.className = 'life-icon' + (i >= lives ? ' lost' : '');
    livesDiv.appendChild(icon);
  }

  // 基地状态
  document.getElementById('baseStatus').textContent = baseAlive ? '完好' : '已摧毁';
  document.getElementById('baseStatus').style.color = baseAlive ? '#4f4' : '#f44';
}

function spawnEnemy() {
  if (enemiesToSpawn <= 0) return;
  const spawnPoints = [
    { x: 1, y: 1 }, { x: COLS - 2, y: 1 }, { x: Math.floor(COLS / 2), y: 1 },
  ];
  const sp = spawnPoints[Math.floor(Math.random() * spawnPoints.length)];

  // 检查出生点是否为空
  const tooClose = [...enemies, playerTank].some(t =>
    t && t.alive && Math.hypot(sp.x - t.x, sp.y - t.y) < 2
  );
  if (tooClose) return;

  const enemyColors = ['#f44', '#f84', '#f4f', '#4af', '#fa4'];
  const color = enemyColors[Math.floor(Math.random() * enemyColors.length)];
  const enemy = new Tank(sp.x, sp.y, 'down', color, false);
  // 随等级提升难度
  enemy.speed = 0.04 + level * 0.008;
  enemy.shootDelay = Math.max(30, 80 - level * 6);
  enemies.push(enemy);
  enemiesToSpawn--;
  enemySpawnCount++;
}

function gameOver() {
  gameState = 'over';
  sfxGameOver();
  document.getElementById('endTitle').textContent = 'GAME OVER';
  document.getElementById('endTitle').style.color = '#f44';
  document.getElementById('finalScore').textContent = `最终得分: ${score}`;
  document.getElementById('gameOverOverlay').classList.add('active');
}

function victory() {
  gameState = 'over';
  sfxLevelUp();
  document.getElementById('endTitle').textContent = '胜 利!';
  document.getElementById('endTitle').style.color = '#ff0';
  document.getElementById('finalScore').textContent = `关卡 ${level} 通过!  得分: ${score}`;
  document.getElementById('gameOverOverlay').classList.add('active');
}

function nextLevel() {
  level++;
  enemiesToSpawn = maxEnemiesPerLevel + level;
  enemySpawnCount = 0;
  enemies = [];
  bullets = [];
  powerUps = [];
  generateMap();
  playerTank.x = Math.floor(COLS / 2);
  playerTank.y = ROWS - 4;
  playerTank.dir = 'up';
  playerTank.alive = true;
  sfxLevelUp();
  updateUI();
}

function respawnPlayer() {
  if (lives <= 0) {
    gameOver();
    return;
  }
  lives--;
  playerTank = new Tank(Math.floor(COLS / 2), ROWS - 4, 'up', '#4f4', true);
  // 清除附近敌人子弹
  bullets = bullets.filter(b => {
    const dist = Math.hypot(b.x - playerTank.x, b.y - playerTank.y);
    return dist > 3 || b.owner === 'player';
  });
  updateUI();
}

// ==================== 游戏循环 ====================

function update() {
  if (gameState !== 'playing') return;

  // 震屏衰减
  if (shakeTimer > 0) shakeTimer--;

  // 生成敌人
  spawnTimer++;
  const aliveEnemies = enemies.filter(e => e.alive).length;
  if (enemiesToSpawn > 0 && aliveEnemies < 4 && spawnTimer > 60) {
    spawnEnemy();
    spawnTimer = 0;
  }

  // 检查是否过关
  if (enemiesToSpawn <= 0 && aliveEnemies === 0) {
    victory();
    return;
  }

  // 更新玩家
  if (playerTank && playerTank.alive) {
    playerTank.update();
  }

  // 更新敌人
  enemies.forEach(e => {
    if (e.alive) e.update();
  });

  // 更新子弹
  bullets.forEach(b => {
    if (!b.alive) return;
    b.x += b.dx * b.speed;
    b.y += b.dy * b.speed;

    const bx = Math.round(b.x);
    const by = Math.round(b.y);

    // 边界
    if (bx < 0 || bx >= COLS || by < 0 || by >= ROWS) {
      b.alive = false;
      spawnParticles(bx * CELL + CELL / 2, by * CELL + CELL / 2, '#fff', 3);
      return;
    }

    // 墙壁碰撞
    const wallType = isWallAt(bx, by);
    if (wallType === 'steel' || wallType === 'boundary') {
      b.alive = false;
      spawnParticles(bx * CELL + CELL / 2, by * CELL + CELL / 2, '#ff0', 5);
      sfxHit();
      return;
    }
    if (wallType === 'brick') {
      b.alive = false;
      destroyWall(bx, by);
      sfxHit();
      return;
    }

    // 基地碰撞
    if (basePos && bx === basePos.x && by === basePos.y) {
      b.alive = false;
      baseAlive = false;
      spawnParticles(bx * CELL + CELL / 2, by * CELL + CELL / 2, '#f00', 30);
      sfxExplode();
      shakeTimer = 20;
      shakeIntensity = 8;
      gameOver();
      return;
    }

    // 玩家子弹打敌人
    if (b.owner === 'player') {
      for (const enemy of enemies) {
        if (!enemy.alive) continue;
        const dist = Math.hypot(bx - enemy.x, by - enemy.y);
        if (dist < 0.7) {
          b.alive = false;
          enemy.hit();
          break;
        }
      }
    }

    // 敌人子弹打玩家
    if (b.owner === 'enemy' && playerTank && playerTank.alive) {
      const dist = Math.hypot(bx - playerTank.x, by - playerTank.y);
      if (dist < 0.7) {
        b.alive = false;
        playerTank.alive = false;
        spawnParticles(
          Math.round(playerTank.x) * CELL + CELL / 2,
          Math.round(playerTank.y) * CELL + CELL / 2,
          '#4f4', 20
        );
        sfxExplode();
        shakeTimer = 15;
        shakeIntensity = 5;
        setTimeout(respawnPlayer, 800);
      }
    }

    // 子弹互相抵消
    if (b.owner === 'player') {
      for (const ob of bullets) {
        if (ob === b || !ob.alive || ob.owner === 'player') continue;
        const dist = Math.hypot(bx - ob.x, by - ob.y);
        if (dist < 0.5) {
          b.alive = false;
          ob.alive = false;
          spawnParticles(bx * CELL + CELL / 2, by * CELL + CELL / 2, '#fff', 3);
          break;
        }
      }
    }
  });

  // 清理
  bullets = bullets.filter(b => b.alive);
  enemies = enemies.filter(e => e.alive || e.flashTimer > 0); // 保留死亡动画

  // 更新粒子
  particles.forEach(p => {
    p.x += p.vx;
    p.y += p.vy;
    p.life -= p.decay;
  });
  particles = particles.filter(p => p.life > 0);

  // 更新道具
  powerUps.forEach(p => { p.timer--; });
  powerUps = powerUps.filter(p => p.timer > 0);

  // 道具拾取
  if (playerTank && playerTank.alive) {
    for (const p of powerUps) {
      const dist = Math.hypot(p.x - playerTank.x, p.y - playerTank.y);
      if (dist < 0.8) {
        sfxPowerUp();
        if (p.type === 'speed') playerTank.speed = Math.min(0.25, playerTank.speed + 0.03);
        if (p.type === 'multiShot') playerTank.shootDelay = Math.max(10, playerTank.shootDelay - 10);
        if (p.type === 'shield') lives = Math.min(5, lives + 1);
        p.timer = 0;
        updateUI();
      }
    }
  }
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // 震屏偏移
  let shakeX = 0, shakeY = 0;
  if (shakeTimer > 0) {
    shakeX = (Math.random() - 0.5) * shakeIntensity * (shakeTimer / 20);
    shakeY = (Math.random() - 0.5) * shakeIntensity * (shakeTimer / 20);
  }

  ctx.save();
  ctx.translate(shakeX, shakeY);

  // 网格线（淡化）
  ctx.strokeStyle = 'rgba(255,255,255,0.03)';
  ctx.lineWidth = 1;
  for (let x = 0; x <= COLS; x++) {
    ctx.beginPath();
    ctx.moveTo(x * CELL, 0);
    ctx.lineTo(x * CELL, canvas.height);
    ctx.stroke();
  }
  for (let y = 0; y <= ROWS; y++) {
    ctx.beginPath();
    ctx.moveTo(0, y * CELL);
    ctx.lineTo(canvas.width, y * CELL);
    ctx.stroke();
  }

  // 绘制墙壁
  walls.forEach(w => {
    const x = w.x * CELL, y = w.y * CELL;
    if (w.type === 'brick') {
      // 砖墙
      ctx.fillStyle = '#b44';
      ctx.fillRect(x + 1, y + 1, CELL - 2, CELL - 2);
      ctx.fillStyle = '#c55';
      ctx.fillRect(x + 1, y + 1, CELL - 2, (CELL - 2) / 2);
      // 砖纹
      ctx.strokeStyle = '#933';
      ctx.lineWidth = 1;
      ctx.strokeRect(x + 1, y + 1, CELL - 2, CELL - 2);
      ctx.beginPath();
      ctx.moveTo(x + 1, y + CELL / 2);
      ctx.lineTo(x + CELL - 1, y + CELL / 2);
      ctx.stroke();
      for (let bx = x + CELL / 2; bx < x + CELL - 1; bx += CELL / 2) {
        ctx.beginPath();
        ctx.moveTo(bx, y + 1);
        ctx.lineTo(bx, y + CELL / 2);
        ctx.stroke();
      }
      for (let bx = x + 1; bx < x + CELL - 1; bx += CELL / 2) {
        ctx.beginPath();
        ctx.moveTo(bx, y + CELL / 2);
        ctx.lineTo(bx, y + CELL - 1);
        ctx.stroke();
      }
    } else if (w.type === 'steel') {
      // 钢墙
      const grad = ctx.createLinearGradient(x, y, x + CELL, y + CELL);
      grad.addColorStop(0, '#aaa');
      grad.addColorStop(0.5, '#ddd');
      grad.addColorStop(1, '#888');
      ctx.fillStyle = grad;
      ctx.fillRect(x + 1, y + 1, CELL - 2, CELL - 2);
      ctx.strokeStyle = '#666';
      ctx.lineWidth = 2;
      ctx.strokeRect(x + 1, y + 1, CELL - 2, CELL - 2);
      // 铆钉
      ctx.fillStyle = '#555';
      [
        [x + 4, y + 4], [x + CELL - 4, y + 4],
        [x + 4, y + CELL - 4], [x + CELL - 4, y + CELL - 4]
      ].forEach(([rx, ry]) => {
        ctx.beginPath();
        ctx.arc(rx, ry, 2, 0, Math.PI * 2);
        ctx.fill();
      });
    }
  });

  // 绘制基地
  if (basePos && baseAlive) {
    const bx = basePos.x * CELL, by = basePos.y * CELL;
    // 基地图标
    const grad = ctx.createLinearGradient(bx, by, bx + CELL, by + CELL);
    grad.addColorStop(0, '#ff0');
    grad.addColorStop(1, '#a80');
    ctx.fillStyle = grad;
    ctx.beginPath();
    // 旗帜形状
    ctx.moveTo(bx + CELL / 2, by + 2);
    ctx.lineTo(bx + CELL - 4, by + CELL / 2);
    ctx.lineTo(bx + CELL / 2, by + CELL - 2);
    ctx.lineTo(bx + 4, by + CELL / 2);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1;
    ctx.stroke();
    // 脉冲
    if (gameState === 'playing') {
      ctx.fillStyle = `rgba(255,255,0,${0.15 + Math.sin(Date.now()/300) * 0.1})`;
      ctx.fillRect(bx - CELL, by - CELL, CELL * 3, CELL * 3);
    }
  } else if (basePos && !baseAlive) {
    const bx = basePos.x * CELL, by = basePos.y * CELL;
    ctx.fillStyle = '#333';
    ctx.fillRect(bx + 4, by + 4, CELL - 8, CELL - 8);
    ctx.fillStyle = '#f00';
    ctx.font = '16px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('✕', bx + CELL / 2, by + CELL / 2 + 6);
  }

  // 绘制道具
  powerUps.forEach(p => {
    if (p.timer > 0) {
      const px = p.x * CELL + CELL / 2;
      const py = p.y * CELL + CELL / 2;
      const blink = Math.sin(Date.now() / 150) * 0.3 + 0.7;
      ctx.globalAlpha = blink;
      ctx.fillStyle = p.type === 'speed' ? '#0af' : p.type === 'multiShot' ? '#f0f' : '#ff0';
      ctx.beginPath();
      ctx.arc(px, py, CELL * 0.3, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = '10px monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const icons = { speed: '⚡', multiShot: '★★', shield: '🛡' };
      ctx.fillText(icons[p.type] || '?', px, py);
      ctx.globalAlpha = 1;
    }
  });

  // 绘制坦克
  enemies.forEach(e => e.draw(ctx));
  if (playerTank) playerTank.draw(ctx);

  // 绘制子弹
  bullets.forEach(b => {
    if (!b.alive) return;
    const bx = b.x * CELL + CELL / 2;
    const by = b.y * CELL + CELL / 2;
    ctx.fillStyle = b.owner === 'player' ? '#ff0' : '#f66';
    ctx.shadowColor = b.owner === 'player' ? '#ff0' : '#f66';
    ctx.shadowBlur = 4;
    ctx.beginPath();
    ctx.arc(bx, by, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  });

  // 绘制粒子
  particles.forEach(p => {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;

  ctx.restore();

  // 生成中提示
  if (gameState === 'playing' && enemiesToSpawn > 0 && enemies.filter(e => e.alive).length < 3) {
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.font = '12px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('敌方坦克正在生成...', canvas.width / 2, 20);
  }
}

function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

// 初始化
generateMap();
playerTank = new Tank(Math.floor(COLS / 2), ROWS - 4, 'up', '#4f4', true);
updateUI();
gameLoop();
</script>
